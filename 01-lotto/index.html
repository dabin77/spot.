<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="1부터 45까지의 숫자 중 로또 번호 6개와 보너스 번호를 무작위로 뽑는 바이브 코딩 연습 웹앱">
  <link rel="icon" href="data:,">
  <title>로또 번호 추첨기</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --surface: #ffffff;
      --text: #171717;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #171717;
      --primary-hover: #343434;
      --focus: #2563eb;
      --radius-lg: 24px;
      --radius-md: 14px;
      --shadow: 0 18px 55px rgb(17 24 39 / 10%);
    }

    * {
      box-sizing: border-box;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, rgb(255 255 255 / 95%), transparent 34%),
        var(--bg);
      font-family: Pretendard, "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 760px);
    }

    .app-card {
      overflow: hidden;
      border: 1px solid rgb(255 255 255 / 85%);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .hero {
      padding: 42px 42px 34px;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 3.4rem);
      line-height: 1.08;
      letter-spacing: -0.055em;
    }

    .intro {
      max-width: 560px;
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.7;
    }

    .draw-panel {
      padding: 38px 42px 42px;
    }

    .number-area {
      min-height: 94px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }

    .main-numbers,
    .bonus-number {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .plus {
      color: var(--muted);
      font-size: 1.35rem;
      font-weight: 600;
    }

    .bonus-wrap {
      display: grid;
      gap: 6px;
      justify-items: center;
    }

    .bonus-label {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
    }

    .ball {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 50%;
      color: #fff;
      font-size: 1.08rem;
      font-weight: 800;
      box-shadow: inset 0 -5px 0 rgb(0 0 0 / 12%), 0 7px 15px rgb(17 24 39 / 13%);
      animation: ball-in 480ms cubic-bezier(.2, .9, .2, 1.15) both;
      animation-delay: calc(var(--order, 0) * 70ms);
    }

    .range-1 { background: #d99a00; }
    .range-2 { background: #2f78c4; }
    .range-3 { background: #d65252; }
    .range-4 { background: #65717d; }
    .range-5 { background: #2e9a63; }

    .placeholder {
      color: var(--muted);
      line-height: 1.6;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    button {
      min-height: 48px;
      padding: 0 22px;
      border: 0;
      border-radius: var(--radius-md);
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease, color 160ms ease;
    }

    button:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--focus) 34%, transparent);
      outline-offset: 3px;
    }

    button:active {
      transform: translateY(1px);
    }

    .draw-button {
      flex: 1;
      color: #fff;
      background: var(--primary);
    }

    .draw-button:hover {
      background: var(--primary-hover);
    }

    .clear-button {
      color: var(--text);
      background: #eef0f2;
    }

    .clear-button:hover {
      background: #e2e5e9;
    }

    .history-panel {
      padding: 30px 42px 38px;
      border-top: 1px solid var(--line);
      background: #fafafa;
    }

    .history-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    h2 {
      margin: 0;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
    }

    .history-count {
      color: var(--muted);
      font-size: 0.82rem;
    }

    .history-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 13px 15px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      font-variant-numeric: tabular-nums;
    }

    .history-main {
      font-weight: 700;
      letter-spacing: 0.035em;
    }

    .history-bonus {
      color: var(--muted);
      font-size: 0.87rem;
      white-space: nowrap;
    }

    .empty-history {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.6;
    }

    .disclaimer {
      margin: 18px 4px 0;
      color: var(--muted);
      font-size: 0.76rem;
      line-height: 1.55;
      text-align: center;
    }

    @keyframes ball-in {
      from {
        opacity: 0;
        transform: translateY(-16px) scale(.72) rotate(-8deg);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1) rotate(0);
      }
    }

    @media (max-width: 660px) {
      body {
        align-items: start;
        padding: 18px 12px;
      }

      .hero,
      .draw-panel,
      .history-panel {
        padding-left: 22px;
        padding-right: 22px;
      }

      .hero {
        padding-top: 30px;
      }

      .number-area {
        min-height: 142px;
        flex-wrap: wrap;
        gap: 12px;
      }

      .main-numbers {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 6px;
      }

      .main-numbers .ball {
        width: 100%;
        height: auto;
        aspect-ratio: 1;
        justify-self: center;
        font-size: 0.96rem;
      }

      .bonus-number .ball {
        width: 48px;
        height: 48px;
      }

      .actions {
        flex-direction: column;
      }

      .clear-button {
        order: 2;
      }

      .history-item {
        align-items: flex-start;
        flex-direction: column;
        gap: 6px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 1ms !important;
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <article class="app-card">
      <header class="hero">
        <p class="eyebrow">Vibe Coding Practice 01</p>
        <h1>로또 번호<br>추첨기</h1>
        <p class="intro">1부터 45까지의 숫자 중 중복 없이 6개를 뽑고, 별도의 보너스 번호를 추첨합니다.</p>
      </header>

      <section class="draw-panel" aria-labelledby="draw-title">
        <h2 id="draw-title" class="visually-hidden">추첨 결과</h2>
        <div id="number-area" class="number-area" aria-live="polite">
          <p class="placeholder">아래 버튼을 누르면 번호가 이곳에 표시됩니다.</p>
        </div>
        <div class="actions">
          <button id="draw-button" class="draw-button" type="button">번호 추첨하기</button>
          <button id="clear-button" class="clear-button" type="button">기록 지우기</button>
        </div>
      </section>

      <section class="history-panel" aria-labelledby="history-title">
        <div class="history-heading">
          <h2 id="history-title">추첨 기록</h2>
          <span id="history-count" class="history-count">0회</span>
        </div>
        <ol id="history-list" class="history-list">
          <li class="empty-history">아직 추첨 기록이 없습니다.</li>
        </ol>
      </section>
    </article>
    <p class="disclaimer">학습용 무작위 추첨기이며 실제 복권 당첨을 예측하지 않습니다.</p>
  </main>

  <script>
    const numberArea = document.querySelector('#number-area');
    const drawButton = document.querySelector('#draw-button');
    const clearButton = document.querySelector('#clear-button');
    const historyList = document.querySelector('#history-list');
    const historyCount = document.querySelector('#history-count');
    const drawHistory = [];

    function numberRangeClass(number) {
      if (number <= 10) return 'range-1';
      if (number <= 20) return 'range-2';
      if (number <= 30) return 'range-3';
      if (number <= 40) return 'range-4';
      return 'range-5';
    }

    function createBall(number, order) {
      const ball = document.createElement('span');
      ball.className = `ball ${numberRangeClass(number)}`;
      ball.style.setProperty('--order', order);
      ball.textContent = number;
      ball.setAttribute('aria-label', `${number}번`);
      return ball;
    }

    function pickNumbers() {
      const pool = Array.from({ length: 45 }, (_, index) => index + 1);

      for (let index = pool.length - 1; index > 0; index -= 1) {
        const randomIndex = Math.floor(Math.random() * (index + 1));
        [pool[index], pool[randomIndex]] = [pool[randomIndex], pool[index]];
      }

      return {
        main: pool.slice(0, 6).sort((a, b) => a - b),
        bonus: pool[6]
      };
    }

    function renderDraw(result) {
      numberArea.replaceChildren();

      const mainNumbers = document.createElement('div');
      mainNumbers.className = 'main-numbers';
      mainNumbers.setAttribute('aria-label', '당첨 번호');
      result.main.forEach((number, index) => {
        mainNumbers.append(createBall(number, index));
      });

      const plus = document.createElement('span');
      plus.className = 'plus';
      plus.textContent = '+';
      plus.setAttribute('aria-hidden', 'true');

      const bonusWrap = document.createElement('div');
      bonusWrap.className = 'bonus-wrap';
      const bonusLabel = document.createElement('span');
      bonusLabel.className = 'bonus-label';
      bonusLabel.textContent = '보너스';
      const bonusNumber = document.createElement('div');
      bonusNumber.className = 'bonus-number';
      bonusNumber.append(createBall(result.bonus, 6));
      bonusWrap.append(bonusLabel, bonusNumber);

      numberArea.append(mainNumbers, plus, bonusWrap);
    }

    function renderHistory() {
      historyList.replaceChildren();
      historyCount.textContent = `${drawHistory.length}회`;

      if (drawHistory.length === 0) {
        const empty = document.createElement('li');
        empty.className = 'empty-history';
        empty.textContent = '아직 추첨 기록이 없습니다.';
        historyList.append(empty);
        return;
      }

      drawHistory.forEach((result, index) => {
        const item = document.createElement('li');
        item.className = 'history-item';

        const main = document.createElement('span');
        main.className = 'history-main';
        main.textContent = `${drawHistory.length - index}회차  ·  ${result.main.join('  ')}`;

        const bonus = document.createElement('span');
        bonus.className = 'history-bonus';
        bonus.textContent = `보너스 ${result.bonus}`;

        item.append(main, bonus);
        historyList.append(item);
      });
    }

    drawButton.addEventListener('click', () => {
      const result = pickNumbers();
      drawHistory.unshift(result);
      renderDraw(result);
      renderHistory();
    });

    clearButton.addEventListener('click', () => {
      drawHistory.length = 0;
      numberArea.innerHTML = '<p class="placeholder">아래 버튼을 누르면 번호가 이곳에 표시됩니다.</p>';
      renderHistory();
      drawButton.focus();
    });
  </script>
</body>
</html>
